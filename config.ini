[General]
; Enable debug logging to KenshiHybridQoL.log
EnableDebugLog = true

[Features]
; 1. Tek Seferde Maksimum Malzeme TaÅŸÄ±ma (Smart Bulk Hauling)
EnableSmartBulkHauling = true

; 2. KapÄ± SaldÄ±rÄ±larÄ±nda Karakter Ä°tiÅŸmesi ve Duvar Ä°Ã§ine Girme (Anti-Gate Clipping)
EnableAntiGateClipping = false

; 3. Bodyguard ve Korunan KiÅŸi Senkronizasyonu (Tactical Escort)
EnableTacticalEscort = true

; 4. Ãœs Ä°Ã§i BayÄ±lan DÃ¼ÅŸmanlarÄ±n Tekrar KalkÄ±p SaldÄ±rmasÄ±nÄ± Ã–nleme (Base Knockout & Execution)
EnableBaseKnockoutFix = true

; 5. Ceset YakÄ±cÄ± Ã–ncesi Otomatik YaÄŸmalama & Kalite Filtreli Eritme (Smart Loot & Auto-Smelt)
EnableSmartLootAndSmelt = false

; 6. Arbalet / Taret NiÅŸancÄ±larÄ±nÄ±n DuvarÄ± Terk Etmemesi (Turret Hold Discipline)
EnableTurretHoldDiscipline = true

[BulkHauling]
; DIAGNOSTIC: log who calls ConstructionState::needsMat / getNeededMats (needed to locate the real hauling code)
TraceHaulingCalls = false
; Maximum items to pull in a single transfer batch (safety cap)
MaxBatchTransferLimit = 50
; EXPERIMENTAL: take several units per fetch from storage (back up your save first)
EnableBulkFetch = true
FetchBatchLimit = 10
; Reserve free weight percentage (0.0 to 1.0) so characters don't get over-encumbered while hauling
EncumbranceSafetyMargin = 0.90

[AntiGateClipping]
; Radius (in meters/game units) around gates & walls where character separation push force is damped
GateProximityRadius = 45.0
; Multiplier applied to character-vs-character push vector near gates (0.0 = zero push, 0.15 = 85% reduction)
SeparationForceMultiplier = 0.05
; Maximum vertical/horizontal step displacement per frame near gates to prevent NavMesh ejection
MaxFrameDisplacementNearGate = 0.12

[TacticalEscort]
; Maximum distance (in meters) a bodyguard can drift from their VIP before breaking combat to catch up
MaxEscortLeashDistance = 18.0
; Distance at which VIP slows down to match bodyguard's combat engagement if VIP is not in full panic
SyncSpeedThresholdDistance = 10.0
; Sync VIP movement speed to Bodyguard when bodyguard is engaged in combat
SyncVIPMovementSpeed = true

[BaseKnockout]
; Seconds a hostile stays down inside a player town before vanilla wake-up is allowed again (0 = never)
HoldDownMaxSeconds = 0
; Also hook Character::isItSafeToGetUp
HookIsItSafeToGetUp = true
; Mode when a hostile character wakes up inside player town:
; 0 = Force Permanent Playing Dead / Surrender
; 1 = Force Flee Out of Town
; 2 = Allow Guards to Execute / Finish Off & Corpse Haulers to burn unconscious hostiles
HostileWakeupMode = 2
; Allow Corpse Disposal job workers to pick up unconscious hostiles inside player town for Corpse Furnace
AllowLiveHostileFurnaceDisposal = true
; Allow player guards to perform lethal / finish-off attacks on unconscious raid enemies inside town
AllowGuardFinishOff = true

[SmartLootAndSmelt]
; Automatically strip equipment from corpses/hostiles before throwing them into Corpse Furnace
StripBeforeCorpseFurnace = true
; Rarity threshold for auto-smelting weapons and armor in Item Furnace.
; Options: Prototype, Shoddy, Standard, High, Blue (Specialist / Catun-Mk), Yellow (Masterwork / Edge), Meitou
; Setting "Blue" means everything STRICTLY BELOW Blue (Prototype, Shoddy, Standard, High / Rusted-Ancient-Catun)
; goes to the Item Furnace, while Blue (Specialist / Mk I+) and above go to Weapon/Armor Storage.
SmeltBelowRarity = Blue
; Keep consumables (First Aid Kits, Food, Cats/Money, Ammo, Resources) out of Item Furnace and send to storage
PreserveConsumablesAndResources = true
; Maximum search radius in player town for Item Furnace and Storage buildings
BuildingSearchRadius = 350.0

[TurretDiscipline]
; EXPERIMENTAL: drop melee/chase goals (Character::addGoal) for characters that used a turret in the last GunnerGraceMs
BlockMeleeGoalsForGunners = true
GunnerGraceMs = 1500
; Minimum vertical elevation delta (units) to consider the operator on a wall/elevated platform
MinWallElevationDelta = 15.0
; Radius around turret within which melee aggro is suppressed unless enemy is on the same wall elevation
BlindspotSuppressionRadius = 35.0
; Hard-lock AI task to Operating Turret when enemies clip into gate below
HardLockTurretTask = true



